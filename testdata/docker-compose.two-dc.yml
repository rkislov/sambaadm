# Optional second DC for replication and topology lifecycle tests.
services:
  dc2:
    build: ./samba
    hostname: dc2
    domainname: sambaadm.test
    networks:
      default:
        aliases: [dc2.sambaadm.test]
    environment:
      SAMBAADM_LAB_PASSWORD: "Lab-Only-Adm1n-Pass!"
      SAMBAADM_JOIN_DC: dc1.sambaadm.test
    depends_on:
      dc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "", "-s", "base", "defaultNamingContext"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
    mem_limit: 1g
    cpus: 2
