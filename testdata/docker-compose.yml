# Disposable Samba AD domain. No host network or privileged/SYS_ADMIN access.
# Run with: docker compose -p sambaadm-it -f testdata/docker-compose.yml up -d --build
services:
  dc:
    build: ./samba
    hostname: dc1
    domainname: sambaadm.test
    networks:
      default:
        aliases: [dc1.sambaadm.test]
    environment:
      SAMBAADM_LAB_PASSWORD: "Lab-Only-Adm1n-Pass!"
    ports:
      - "127.0.0.1:${SAMBAADM_LDAP_PORT:-0}:389"
      - "127.0.0.1:${SAMBAADM_LDAPS_PORT:-0}:636"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1", "-b", "", "-s", "base", "defaultNamingContext"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    mem_limit: 1g
    cpus: 2
