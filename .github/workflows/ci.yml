name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Domain deployment repository and mutation gates
        run: |
          python3 -m unittest discover -s internal/domaininit -p 'test_*.py' -v
          python3 -m unittest discover -s internal/dcdemote -p 'test_*.py' -v
      - name: Vet
        run: go vet ./...
      - name: ALT template compatibility (pinned upstream)
        run: |
          git init "$RUNNER_TEMP/alt-templates"
          git -C "$RUNNER_TEMP/alt-templates" fetch --depth 1 https://github.com/altlinux/admx-basealt.git 8205b08f69dc9365c92bfd8451b2863f757d356b
          git -C "$RUNNER_TEMP/alt-templates" checkout --detach FETCH_HEAD
          SAMBAADM_ALT_TEMPLATES="$RUNNER_TEMP/alt-templates" go test ./internal/policy -run TestALTTemplateCollection -count=1 -v
      - name: Build
        run: make build

  release-dry:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile (github set)
        run: make release-github
      - name: Verify static Linux binary
        run: |
          file dist/sambaadm-linux-amd64
          if readelf -lW dist/sambaadm-linux-amd64 | grep -Eq 'INTERP|DYNAMIC'; then
            echo "Linux release must not depend on a dynamic loader or glibc"
            exit 1
          fi
          ./dist/sambaadm-linux-amd64 version

  samba-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real Samba AD directory, DNS, GPO and HTTP tests
        run: SAMBAADM_TWO_DC=1 SAMBAADM_HELPERS=1 make integration
      - name: RODC policy, preload and local authentication audit through helper
        run: SAMBAADM_RODC=1 make integration
      - name: Native cold DC backup and isolated restore without Samba CLI
        run: testdata/samba/test-domain-backup.sh
      - name: Forest-loss recovery from a full cold backup into a new DC
        run: testdata/samba/test-domain-restore.sh

  dns-routing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real DNS backend round trip and conditional forwarding below AD
        run: sh testdata/samba/test-dns-routing.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Offline survey presentation models
        run: |
          node testdata/web/survey-coverage.cjs
          node testdata/web/survey-workstation.cjs
      - name: Workstation survey browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/survey-workstation-browser.cjs
      - name: First forest and additional controller wizard
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/domain-init.cjs
      - name: Existing AD bootstrap and resume browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/domain-init-existing.cjs
      - name: Windows SYSVOL sync browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/sysvol-sync.cjs
      - name: DC retirement wizard and resumable member setup
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/domain-demote.cjs
      - name: Compact dashboard and SSO fallback
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/dashboard.cjs
      - name: CUPS console and home role dialog
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/printing.cjs
      - name: Kea DHCP console and DDNS browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/kea.cjs
      - name: Domain search and direct object cards
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/domain-search.cjs
      - name: User login diagnosis and unlock
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/user-login.cjs
      - name: PSO management and resultant user policy
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/pso.cjs
      - name: GPO and RODC cards and diagnostics layout
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/admin-cards.cjs
      - name: DNS delegation, multi-server forwarding and backend controls
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/dns-routing.cjs
      - name: Share server selection
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/share-server.cjs
      - name: Group cards and delegation browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/group-card.cjs
      - name: Helper SSH installer browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/helper-install.cjs
      - name: Helper installation log pagination browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/helper-log-pagination.cjs
      - name: Shared compact action menus
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/compact-actions.cjs
      - name: Avatar upload and client resize
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/self-photo.cjs
      - name: Compact controls and complete policy tree
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/controls.cjs
      - name: Bulk user operations
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/user-bulk.cjs
      - name: Employee lifecycle wizard
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/employee.cjs
      - name: Web workspace contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/workspace.cjs
      - name: Folder navigation and table preferences
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/directory-navigation.cjs
      - name: Certificate rollout browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/certificate-rollout.cjs
      - name: FSMO target controller browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/fsmo.cjs
      - name: Scalable topology browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/topology.cjs
      - name: Policy console browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/policy-console.cjs
      - name: Domain password policy browser contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/password-policy.cjs
      - name: RSAT DNS and simplified modeling contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/rsat-managers.cjs

  gpui-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GPUI parser build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev libboost-dev g++ pkg-config
      - name: Fetch pinned GPUI and gpupdate sources
        run: |
          git init "$RUNNER_TEMP/gpui"
          git -C "$RUNNER_TEMP/gpui" fetch --depth 1 https://github.com/august-alt/gpui.git 2fc8c0b0fe09686c45272ba4e7052b5cd9c04262
          git -C "$RUNNER_TEMP/gpui" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/gpupdate"
          git -C "$RUNNER_TEMP/gpupdate" fetch --depth 1 https://github.com/altlinux/gpupdate.git 00659d16fef4fff8bc46ef58b7d753551981cff4
          git -C "$RUNNER_TEMP/gpupdate" checkout --detach FETCH_HEAD
      - name: Actual GPUI INI plugin and ALT client roundtrip
        run: |
          mkdir -p "$RUNNER_TEMP/script-fixtures"
          export SAMBAADM_GPUI_FIXTURES="$RUNNER_TEMP/script-fixtures"
          go test ./internal/service -run '^TestGPUIINIInterop$' -count=1
          g++ -std=c++17 -fPIC -I"$RUNNER_TEMP/gpui/src" $(pkg-config --cflags Qt5Core) testdata/gpui/roundtrip.cpp "$RUNNER_TEMP/gpui/src/io/inifile.cpp" -o "$RUNNER_TEMP/gpui-roundtrip" $(pkg-config --libs Qt5Core)
          "$RUNNER_TEMP/gpui-roundtrip" "$SAMBAADM_GPUI_FIXTURES/input.ini" "$SAMBAADM_GPUI_FIXTURES/gpui.ini"
          SAMBAADM_GPUI_ROUNDTRIP=1 go test ./internal/service -run '^TestGPUIINIInterop$' -count=1
          python3 testdata/gpui/check_gpupdate.py "$RUNNER_TEMP/gpupdate" "$SAMBAADM_GPUI_FIXTURES"

  alt-rpm:
    uses: ./.github/workflows/rpm-build.yml
    with:
      version: '0.0.0'
