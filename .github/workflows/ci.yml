name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: ALT template compatibility (pinned upstream)
        run: |
          git init "$RUNNER_TEMP/alt-templates"
          git -C "$RUNNER_TEMP/alt-templates" fetch --depth 1 https://github.com/altlinux/admx-basealt.git 8205b08f69dc9365c92bfd8451b2863f757d356b
          git -C "$RUNNER_TEMP/alt-templates" checkout --detach FETCH_HEAD
          SAMBAADM_ALT_TEMPLATES="$RUNNER_TEMP/alt-templates" go test ./internal/policy -run TestALTTemplateCollection -count=1 -v
      - name: Build
        run: make build

  release-dry:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile (github set)
        run: make release-github
      - name: Verify static Linux binary
        run: |
          file dist/sambaadm-linux-amd64
          if readelf -lW dist/sambaadm-linux-amd64 | grep -Eq 'INTERP|DYNAMIC'; then
            echo "Linux release must not depend on a dynamic loader or glibc"
            exit 1
          fi
          ./dist/sambaadm-linux-amd64 version

  samba-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real Samba AD directory, DNS, GPO and HTTP tests
        run: SAMBAADM_TWO_DC=1 make integration

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Web workspace contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/workspace.cjs

  gpui-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GPUI parser build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev libboost-dev g++ pkg-config
      - name: Fetch pinned GPUI and gpupdate sources
        run: |
          git init "$RUNNER_TEMP/gpui"
          git -C "$RUNNER_TEMP/gpui" fetch --depth 1 https://github.com/august-alt/gpui.git 2fc8c0b0fe09686c45272ba4e7052b5cd9c04262
          git -C "$RUNNER_TEMP/gpui" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/gpupdate"
          git -C "$RUNNER_TEMP/gpupdate" fetch --depth 1 https://github.com/altlinux/gpupdate.git 00659d16fef4fff8bc46ef58b7d753551981cff4
          git -C "$RUNNER_TEMP/gpupdate" checkout --detach FETCH_HEAD
      - name: Actual GPUI INI plugin and ALT client roundtrip
        run: |
          mkdir -p "$RUNNER_TEMP/script-fixtures"
          export SAMBAADM_GPUI_FIXTURES="$RUNNER_TEMP/script-fixtures"
          go test ./internal/service -run '^TestGPUIINIInterop$' -count=1
          g++ -std=c++17 -fPIC -I"$RUNNER_TEMP/gpui/src" $(pkg-config --cflags Qt5Core) testdata/gpui/roundtrip.cpp "$RUNNER_TEMP/gpui/src/io/inifile.cpp" -o "$RUNNER_TEMP/gpui-roundtrip" $(pkg-config --libs Qt5Core)
          "$RUNNER_TEMP/gpui-roundtrip" "$SAMBAADM_GPUI_FIXTURES/input.ini" "$SAMBAADM_GPUI_FIXTURES/gpui.ini"
          SAMBAADM_GPUI_ROUNDTRIP=1 go test ./internal/service -run '^TestGPUIINIInterop$' -count=1
          python3 testdata/gpui/check_gpupdate.py "$RUNNER_TEMP/gpupdate" "$SAMBAADM_GPUI_FIXTURES"

  alt-rpm:
    uses: ./.github/workflows/rpm-build.yml
    with:
      version: '0.0.0'
