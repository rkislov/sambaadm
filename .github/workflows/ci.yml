name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: ALT template compatibility (pinned upstream)
        run: |
          git init "$RUNNER_TEMP/alt-templates"
          git -C "$RUNNER_TEMP/alt-templates" fetch --depth 1 https://github.com/altlinux/admx-basealt.git 8205b08f69dc9365c92bfd8451b2863f757d356b
          git -C "$RUNNER_TEMP/alt-templates" checkout --detach FETCH_HEAD
          SAMBAADM_ALT_TEMPLATES="$RUNNER_TEMP/alt-templates" go test ./internal/policy -run TestALTTemplateCollection -count=1 -v
      - name: Build
        run: make build

  release-dry:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile (github set)
        run: make release-github
      - name: Verify static Linux binary
        run: |
          file dist/sambaadm-linux-amd64
          if readelf -lW dist/sambaadm-linux-amd64 | grep -Eq 'INTERP|DYNAMIC'; then
            echo "Linux release must not depend on a dynamic loader or glibc"
            exit 1
          fi
          ./dist/sambaadm-linux-amd64 version

  samba-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Real Samba AD directory, DNS, GPO and HTTP tests
        run: SAMBAADM_TWO_DC=1 make integration

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Web workspace contracts
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" node testdata/web/workspace.cjs

  alt-rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ALT p10 RPM
        run: make rpm-alt VERSION=0.0.0 RPM_ARCH=amd64
      - name: ALT RPM lifecycle (systemd simulated)
        run: docker run --rm -v "$PWD:/src:ro" sambaadm-rpm-builder:p10-amd64 bash testdata/packaging/test-alt.sh /src/dist/sambaadm-linux-amd64
      - name: ALT p10 real systemd update and rollback
        run: |
          trap 'docker logs --tail 50 sambaadm-alt-systemd || true; docker rm -f sambaadm-alt-systemd || true' EXIT
          docker run -d --name sambaadm-alt-systemd --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock -v "$PWD:/src:ro" sambaadm-rpm-builder:p10-amd64 /lib/systemd/systemd
          for attempt in $(seq 1 30); do
            if docker exec sambaadm-alt-systemd systemctl show -p Version --value | grep -q .; then break; fi
            sleep 1
          done
          docker exec -e SAMBAADM_REAL_SYSTEMD=1 sambaadm-alt-systemd bash /src/testdata/packaging/test-alt.sh /src/dist/sambaadm-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: alt-rpm
          path: dist/*.rpm
