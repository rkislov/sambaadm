                "400": {"description": "Invalid or unsupported recovery data"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin required"}
                "409": {"description": "Unexpected LDAP version"}
                "502": {"description": "Read failed"}
    "/gpo/{gpo}/scripts/backup":
