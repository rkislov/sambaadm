                "502":
                    "description": "LDAP or Samba RPC failed"
            "summary": "Update connection state or user-owned UTC schedule"
        "delete":
            "parameters":
                - "in": "path"
                  "name": "id"
                  "required": true
                  "schema":
                    "type": "string"
                - "in": "header"
                  "name": "X-CSRF-Token"
                  "required": true
                  "schema":
                    "type": "string"
            "requestBody":
                "content":
                    "application/json":
                        "schema":
                            "additionalProperties": false
                            "properties":
                                "revision":
                                    "type": "string"
                            "required":
                                - "revision"
                            "type": "object"
                "required": true
            "responses":
                "200":
                    "description": "Operation result"
                "400":
                    "description": "Invalid input or blocked Site Link schedule"
                "401":
                    "description": "Session required"
                "403":
                    "description": "Admin role or CSRF required for mutations"
                "409":
                    "description": "Object changed; reload required"
                "502":
                    "description": "LDAP or Samba RPC failed"
            "summary": "Delete connection; KCC may recreate generated connections"
    "/gpo/explain":
        "post":
            "summary": "Explain domain/OU GPO eligibility using LDAP facts without filter assumptions"
            "description": "All authenticated roles; CSRF required. Does not require the policy editor, SMB or ADMX. Conditional candidates are not proof of client application."
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "properties":
                                "user": {"type": "string", "description": "User or domain/OU DN; at least one target is required"}
                                "computer": {"type": "string", "description": "Computer or domain/OU DN"}
            "responses":
                "200": {"description": "Sections with target, container, inheritance path and links; each link contains checks (pass/fail/unknown), status (excluded/conditional), optional priority and processingOrder. See docs/api.md."}
                "400": {"description": "Invalid target or request"}
                "401": {"description": "Session required"}
                "403": {"description": "CSRF required"}
                "502": {"description": "LDAP unavailable"}
    "/gpo/{gpo}/consistency":
        "parameters":
            - "name": "gpo"
              "in": "path"
              "required": true
              "schema": {"type": "string"}
        "post":
            "summary": "Read-only LDAP and SYSVOL comparison across discovered domain controllers"
            "description": "All authenticated roles; CSRF required. Reference is a comparison baseline, not an authoritative source. No replication or repair is performed."
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "properties":
                                "reference": {"type": "string", "description": "Optional discovered DC DNS name; unavailable explicit reference is not replaced"}
            "responses":
                "200": {"description": "Report with status consistent/different/incomplete/single-controller, complete, hasDifferences, reference, timestamps and per-DC LDAP/SYSVOL states, versions, file hashes, ACL fingerprints and differences. See docs/api.md."}
                "400": {"description": "Invalid GPO, reference or controller count"}
                "401": {"description": "Session required"}
                "403": {"description": "CSRF required"}
                "409": {"description": "Another consistency check is running"}
                "502": {"description": "Discovery or source GPO unavailable"}
    "/gpo/{gpo}/delegation/full":
        "parameters":
            - "name": "gpo"
              "in": "path"
              "required": true
              "schema": {"type": "string"}
        "get":
            "summary": "Read trusted local delegation history for this GPO/controller; admin only"
            "responses":
                "200": {"description": "records (ID, operation, source, profile, SID, state, created, revoked) and pending record ID"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin required"}
                "502": {"description": "Local state, LDAP or SYSVOL unavailable"}
        "post":
            "summary": "Preview coordinated LDAP/SYSVOL grant, revoke, completion or rollback; admin and CSRF required"
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "required": ["operation"]
                            "properties":
                                "operation": {"type": "string", "enum": ["grant", "revoke", "complete", "rollback"]}
                                "principal": {"type": "string", "description": "Grant only: domain principal DN or S-1-5-11"}
                                "profile": {"type": "string", "enum": ["read", "read-apply", "edit"], "description": "Grant only"}
                                "source": {"type": "string", "description": "Recorded grant ID for revoke; pending ID for complete/rollback"}
            "responses":
                "200": {"description": "preview token, operation, source, dn, sid, profile, LDAP state, file paths/states and conflicts; conflicts prevent writing"}
                "400": {"description": "Invalid operation or record"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin and CSRF required"}
                "502": {"description": "State, LDAP or SYSVOL unavailable; policy journal may require recovery"}
        "put":
            "summary": "Apply the exact preview; preserve trusted local recovery record on failure"
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "required": ["operation", "preview"]
                            "properties":
                                "operation": {"type": "string", "enum": ["grant", "revoke", "complete", "rollback"]}
                                "principal": {"type": "string"}
                                "profile": {"type": "string", "enum": ["read", "read-apply", "edit"]}
                                "source": {"type": "string"}
                                "preview": {"type": "string"}
            "responses":
                "200": {"description": "ACLs verified and operation complete"}
                "400": {"description": "Invalid request"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin and CSRF required"}
                "409": {"description": "Stale preview or ACL/tree conflict; refresh and inspect pending state"}
                "502": {"description": "Operation failed or outcome unknown; refresh history for recovery"}
    "/gpo/{gpo}/delegation":
        "parameters":
            - "name": "gpo"
              "in": "path"
              "required": true
              "schema": {"type": "string"}
        "get":
            "summary": "Read current GPO LDAP DACL; all authenticated roles"
            "responses":
                "200": {"description": "Revision and decoded ACEs; this endpoint does not offer removals"}
                "401": {"description": "Session required"}
                "502": {"description": "LDAP unavailable"}
        "post":
            "summary": "Preview additive LDAP-only permission grant; admin and CSRF required"
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "required": ["revision", "principal", "profile"]
                            "properties":
                                "revision": {"type": "string"}
                                "principal": {"type": "string", "description": "Domain principal DN or S-1-5-11"}
                                "profile": {"type": "string", "enum": ["read", "read-apply", "edit-ldap"]}
            "responses":
                "200": {"description": "Preview token, added ACEs, unchanged count, resolved SID, profile and LDAP-only warnings"}
                "400": {"description": "Invalid input or unsupported DACL ordering"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin and CSRF required"}
                "409": {"description": "Stale revision"}
                "502": {"description": "LDAP unavailable"}
        "put":
            "summary": "Apply the previewed LDAP-only grant; existing ACEs and SYSVOL preserved"
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "required": ["revision", "principal", "profile", "preview"]
                            "properties":
                                "revision": {"type": "string"}
                                "principal": {"type": "string"}
                                "profile": {"type": "string", "enum": ["read", "read-apply", "edit-ldap"]}
                                "preview": {"type": "string", "description": "Token returned by POST; bound to exact ACL, revision, profile and resolved SID"}
            "responses":
                "200": {"description": "Granted or already present; effective access is not evaluated"}
                "400": {"description": "Invalid input"}
                "401": {"description": "Session required"}
                "403": {"description": "Admin and CSRF required"}
                "409": {"description": "Preview or revision changed; reload and preview again"}
                "502": {"description": "LDAP unavailable"}
    "/gpo/model":
        "post":
            "summary": "Read-only domain/OU Registry.pol and ALT policy modeling with explicit filter assumptions"
            "description": "All authenticated roles; X-CSRF-Token required. Returns effective ALT settings, winning GPOs, conflicting contributions and incomplete calculation warnings. See docs/api.md and docs/web.md for limits."
            "requestBody":
                "required": true
                "content":
                    "application/json":
                        "schema":
                            "type": "object"
                            "additionalProperties": false
                            "required": ["loopback", "security", "wmi"]
                            "properties":
                                "user": {"type": "string", "description": "User, domain or OU DN; user or computer required"}
                                "computer": {"type": "string", "description": "Computer, domain or OU DN"}
                                "userOU": {"type": "string", "description": "Hypothetical user domain/OU DN"}
                                "computerOU": {"type": "string", "description": "Hypothetical computer domain/OU DN"}
                                "loopback": {"type": "string", "enum": ["none", "merge", "replace"]}
                                "security": {"type": "string", "enum": ["unknown", "allow", "deny"]}
                                "wmi": {"type": "string", "enum": ["unknown", "allow", "deny"]}
                                "securityOverrides": {"type": "object", "additionalProperties": {"type": "string", "enum": ["unknown", "allow", "deny"]}}
                                "wmiOverrides": {"type": "object", "additionalProperties": {"type": "string", "enum": ["unknown", "allow", "deny"]}}
            "responses":
                "200": {"description": "Model report with sections, ALT settings, registry values, conflicts and limitations"}
                "400": {"description": "Invalid scenario"}
                "401": {"description": "Session required"}
                "403": {"description": "CSRF token required"}
                "502": {"description": "LDAP/SYSVOL or ALT templates unavailable"}
