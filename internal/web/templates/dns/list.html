{{define "dns/list.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    <h1>{{t .Lang "nav.dns"}}</h1>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <table>
      <thead><tr><th>Zone</th><th>Source</th><th>DN</th></tr></thead>
      <tbody>
      {{range .Content}}
        <tr>
          <td>{{.Name}}</td>
          <td>{{.Source}}</td>
          <td class="mono">{{.DN}}</td>
        </tr>
      {{else}}
        <tr><td colspan="3" class="muted">{{t $.Lang "common.no_data"}}</td></tr>
      {{end}}
      </tbody>
    </table>
  </main>
  <footer class="footer"><span>sambaadm · Samba4 AD</span></footer>
</body>
</html>
{{end}}
