{{define "users/create.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    <h1>{{t .Lang "nav.users"}}</h1>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <form method="post" action="/users" class="form-card">
      {{if .CSRF}}<input type="hidden" name="csrf_token" value="{{.CSRF}}">{{end}}
      <label>Login <input name="login" required autocomplete="off"></label>
      <label>Display name <input name="display"></label>
      <label>Password <input type="password" name="password" required autocomplete="new-password"></label>
      <label>OU (DN) <input name="ou" placeholder="OU=People,DC=example,DC=com"></label>
      <label>Email <input type="email" name="mail"></label>
      <label class="check"><input type="checkbox" name="enabled" value="1" checked> Enabled</label>
      <button type="submit">OK</button>
    </form>
  </main>
  <footer class="footer"><span>sambaadm · Samba4 AD</span></footer>
</body>
</html>
{{end}}
