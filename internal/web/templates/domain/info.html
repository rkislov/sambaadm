{{define "domain/info.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">sambaadm</a>
    <nav>
      <a href="/">Дашборд</a>
      <a href="/users">Пользователи</a>
      <a href="/groups">Группы</a>
      <a href="/domain" class="active">Домен</a>
    </nav>
    <div class="user">
      <span>{{.User}}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="linkish">Выход</button>
      </form>
    </div>
  </header>
  <main class="container">
    <h1>Домен</h1>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    {{with .Content}}
    <dl class="kv">
      <dt>Base DN</dt><dd class="mono">{{.BaseDN}}</dd>
      <dt>DNS root</dt><dd>{{.DNSRoot}}</dd>
      <dt>NetBIOS</dt><dd>{{.NetBIOS}}</dd>
      <dt>Function level</dt><dd>{{.FunctionLvl}}</dd>
    </dl>
    {{end}}
  </main>
</body>
</html>
{{end}}
