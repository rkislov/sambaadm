{{define "login.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .Lang "login.title"}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/ui.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1 class="brand">sambaadm</h1>
    <p class="muted">{{t .Lang "login.subtitle"}}</p>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label>{{t .Lang "login.username"}}
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>{{t .Lang "login.password"}}
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <details class="login-advanced" {{if or .LegacyCN .SkipLDAPVerify}}open{{end}}><summary>Расширенные параметры</summary>
        <label class="session-auth-choice"><input type="checkbox" name="helper_auth" value="session" {{if .HelperSession}}checked{{end}}><span>Моя учётная запись для SYSVOL через helper<small>Пароль хранится зашифрованным в памяти до выхода или окончания сессии.</small></span></label>
        <label class="session-auth-choice"><input type="checkbox" name="ldap_legacy_cn" value="allow" {{if .LegacyCN}}checked{{end}}><span>Разрешить LDAP-сертификат без SAN с точным CN<small>Только для этой сессии. Доверие к CA, срок действия и имя контроллера проверяются. Сертификат с другим SAN не принимается.</small></span></label>
        <label class="session-auth-choice"><input type="checkbox" name="ldap_skip_verify" value="allow" {{if .SkipLDAPVerify}}checked{{end}}><span>Не проверять LDAP-сертификат (только для теста)<small>Только для этой сессии. Отключает проверки CA, имени и срока действия. Соединение остаётся зашифрованным, но подлинность сервера не подтверждается: возможен перехват пароля. Проверка сертификатов helper не меняется.</small></span></label>
      </details>
      <button type="submit">{{t .Lang "login.submit"}}</button>
    </form>
  </main>
</body>
</html>
{{end}}
