{{define "login.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .Lang "login.title"}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1 class="brand">sambaadm</h1>
    <p class="muted">{{t .Lang "login.subtitle"}}</p>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label>{{t .Lang "login.username"}}
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>{{t .Lang "login.password"}}
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">{{t .Lang "login.submit"}}</button>
    </form>
  </main>
</body>
</html>
{{end}}
