{{define "dashboard.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">sambaadm</a>
    <nav>
      <a href="/" class="active">Дашборд</a>
      <a href="/users">Пользователи</a>
      <a href="/groups">Группы</a>
      <a href="/domain">Домен</a>
    </nav>
    <div class="user">
      <span>{{.User}} <small>({{.Role}})</small></span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="linkish">Выход</button>
      </form>
    </div>
  </header>
  <main class="container">
    <h1>Дашборд</h1>
    <p class="muted">Состояние подключения к контроллеру домена.</p>
    <dl class="kv">
      <dt>LDAP URI</dt><dd>{{index .Content "LDAP"}}</dd>
      <dt>Base DN</dt><dd>{{index .Content "Base"}}</dd>
    </dl>
  </main>
</body>
</html>
{{end}}
