{{define "dashboard.html"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <h1>{{t .Lang "dashboard.title"}}</h1>
    <p class="muted">{{t .Lang "dashboard.hint"}}</p>
    <dl class="kv">
      <dt>LDAP URI</dt><dd>{{index .Content "LDAP"}}</dd>
      <dt>Base DN</dt><dd>{{index .Content "Base"}}</dd>
    </dl>
  </main>
  <footer class="footer"><span>sambaadm · Samba4 AD</span></footer>
</body>
</html>
{{end}}
