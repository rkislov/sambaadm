{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">sambaadm</a>
    {{if .User}}
    <nav>
      <a href="/">Дашборд</a>
      <a href="/users">Пользователи</a>
      <a href="/groups">Группы</a>
      <a href="/domain">Домен</a>
    </nav>
    <div class="user">
      <span>{{.User}} <small>({{.Role}})</small></span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="linkish">Выход</button>
      </form>
    </div>
    {{end}}
  </header>
  <main class="container">
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    {{if .Flash}}<div class="alert">{{.Flash}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer class="footer">
    <span>sambaadm · Samba4 AD</span>
  </footer>
</body>
</html>
{{end}}
