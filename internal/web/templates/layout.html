{{define "layout"}}
<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  {{template "head" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    {{if .Flash}}<div class="alert">{{.Flash}}</div>{{end}}
    {{block "content" .}}{{end}}
  </main>
  <footer class="footer">
    <span>sambaadm · Samba4 AD</span>
  </footer>
</body>
</html>
{{end}}
