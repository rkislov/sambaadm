{{define "groups/list.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · sambaadm</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">sambaadm</a>
    <nav>
      <a href="/">Дашборд</a>
      <a href="/users">Пользователи</a>
      <a href="/groups" class="active">Группы</a>
      <a href="/computers">Компьютеры</a>
      <a href="/ou">OU</a>
      <a href="/domain">Домен</a>
    </nav>
    <div class="user">
      <span>{{.User}}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="linkish">Выход</button>
      </form>
    </div>
  </header>
  <main class="container">
    <h1>Группы</h1>
    {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
    <table>
      <thead><tr><th>Имя</th><th>Участников</th><th>DN</th></tr></thead>
      <tbody>
      {{range .Content}}
        <tr>
          <td>{{.SAMAccountName}}</td>
          <td>{{len .Members}}</td>
          <td class="mono">{{.DN}}</td>
        </tr>
      {{else}}
        <tr><td colspan="3" class="muted">Нет данных</td></tr>
      {{end}}
      </tbody>
    </table>
  </main>
</body>
</html>
{{end}}
